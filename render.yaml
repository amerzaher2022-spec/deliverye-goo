# Render Blueprint: one web service (game + dashboard + API) and one PostgreSQL
# database. In Render: New -> Blueprint -> pick this repository.
# You will be asked for ADMIN_EMAIL and ADMIN_PASSWORD (12+ characters).
services:
  - type: web
    name: erbil-delivery-world
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: erbil-delivery-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # demo deployment: allows the guarded "reset demo data" button
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_EMPTY
        value: "true"

databases:
  - name: erbil-delivery-db
    plan: free
    region: frankfurt
    databaseName: erbil_delivery
