name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dg
          POSTGRES_PASSWORD: dg
          POSTGRES_DB: deliverygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dg:dg@localhost:5432/deliverygo_test
      E2E_DATABASE_URL: postgresql://dg:dg@localhost:5432/deliverygo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser tests
        run: |
          PGPASSWORD=dg psql -h localhost -U dg -d deliverygo_test -c "CREATE DATABASE deliverygo_e2e"
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:e2e
