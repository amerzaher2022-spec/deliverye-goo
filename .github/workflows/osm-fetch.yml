# Downloads OpenStreetMap data for central Erbil (© OpenStreetMap contributors, ODbL) through the
# Overpass API and commits the raw extract to data/osm/. The game's district is then built from it
# with scripts/build-district.mjs. Run it from the Actions tab ("Run workflow"); it also runs once
# when this file changes.
name: Fetch OpenStreetMap data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/osm-fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        run: |
          mkdir -p data/osm
          fetch() { # fetch QUERY_FILE OUT_FILE
            for attempt in 1 2 3 4; do
              for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
                if curl -sS --fail -m 300 -A "erbil-delivery-world/0.1 (github actions)" --data-urlencode "data@$1" "$url" -o "$2"; then
                  echo "$2 from $url: $(wc -c < "$2") bytes"; return 0
                fi
                sleep 15
              done
            done
            return 1
          }
          # the city inside and around the 60 Meter ring road, in 3 x 3 tiles: roads (with tunnel, bridge,
          # lanes and name tags) and named places
          S=36.150; N=36.230; W=43.950; E=44.065
          i=0
          for r in 0 1 2; do for c in 0 1 2; do
            s=$(echo "$S + ($N - $S) * $r / 3" | bc -l); n=$(echo "$S + ($N - $S) * ($r + 1) / 3" | bc -l)
            w=$(echo "$W + ($E - $W) * $c / 3" | bc -l); e=$(echo "$W + ($E - $W) * ($c + 1) / 3" | bc -l)
            printf '[out:json][timeout:180];way["highway"~"^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service|pedestrian)$"](%.5f,%.5f,%.5f,%.5f);out geom tags;' $s $w $n $e > /tmp/streets_$i.ql
            fetch /tmp/streets_$i.ql /tmp/streets_$i.json
            i=$((i + 1))
            sleep 5
          done; done
          jq -s '{elements: (map(.elements) | add | unique_by(.id))}' /tmp/streets_*.json > data/osm/streets.json
          echo "streets: $(jq '.elements | length' data/osm/streets.json) ways"
          BBOX="$S,$W,$N,$E"
          cat > /tmp/places.ql <<QL
          [out:json][timeout:180];
          (
            nwr["name"]["amenity"](${BBOX});
            nwr["name"]["shop"](${BBOX});
            nwr["name"]["tourism"](${BBOX});
            nwr["name"]["office"](${BBOX});
            nwr["name"]["leisure"](${BBOX});
            nwr["name"]["building"](${BBOX});
            nwr["name"]["landuse"="residential"](${BBOX});
            nwr["name"]["place"](${BBOX});
          );
          out center tags;
          QL
          fetch /tmp/places.ql data/osm/places.json
          gzip -9f data/osm/streets.json data/osm/places.json
          ls -la data/osm
      - name: Commit
        run: |
          echo "Data © OpenStreetMap contributors, available under the Open Database License (ODbL): https://www.openstreetmap.org/copyright. Fetched $(date -u +%F) with .github/workflows/osm-fetch.yml." > data/osm/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git commit -m "OpenStreetMap extract of central Erbil (ODbL)" || echo "no changes"
          git push
